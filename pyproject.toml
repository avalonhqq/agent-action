[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "bili-support-ai"
version = "0.0.1"
description = "A learning-first, enterprise-style multi-agent customer service platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "aiomysql>=0.3,<1.0",
  "aiosqlite>=0.22,<1.0",
  "alembic>=1.17,<2.0",
  "cryptography>=45,<47",
  "elasticsearch[async]>=9.4,<10.0",
  "fastapi>=0.121,<1.0",
  "httpx>=0.28,<1.0",
  "jieba>=0.42.1,<1.0",
  "langgraph>=1.2,<2.0",
  "langgraph-checkpoint-mongodb>=0.4,<0.5",
  "pycryptodome>=3.23,<4.0",
  "nicegui>=3.7,<4.0",
  "pydantic>=2.12,<3.0",
  "pydantic-settings>=2.12,<3.0",
  "pymupdf>=1.26,<2.0",
  "pymilvus>=2.6,<2.7",
  "python-docx>=1.2,<2.0",
  "python-multipart>=0.0.20,<1.0",
  "redis>=7.0,<8.0",
  "sqlalchemy[asyncio]>=2.0.44,<3.0",
  "structlog>=25,<27",
  "sentencepiece>=0.2,<1.0",
  "torch>=2.13,<2.14",
  "transformers>=5.14,<6.0",
  "uvicorn[standard]>=0.38,<1.0",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.18,<2.0",
  "pre-commit>=4.0,<5.0",
  "pytest>=9.0,<10.0",
  "pytest-asyncio>=1.0,<2.0",
  "ruff>=0.14,<1.0",
]

[project.scripts]
bili-intent = "bili_support.intent.cli:main"
bili-intent-eval = "bili_support.evaluation.intent_cli:main"
bili-chunk-eval = "bili_support.evaluation.chunk_cli:main"
bili-retrieval-eval = "bili_support.evaluation.retrieval_cli:main"
bili-policy-eval = "bili_support.evaluation.policy_cli:main"
bili-rag-eval = "bili_support.evaluation.rag_cli:main"
bili-claim-verifier-eval = "bili_support.evaluation.claim_verifier_cli:main"
bili-dictionary-seed = "bili_support.knowledge.dictionary_seed:main"
bili-lexical-sync = "bili_support.knowledge.lexical_sync_cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/bili_support"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["bili_support"]
