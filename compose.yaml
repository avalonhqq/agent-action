services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: bili_support
      MYSQL_ROOT_PASSWORD: local-mysql-root-password
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-plocal-mysql-root-password"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - mysql_data:/var/lib/mysql
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - redis_data:/data
    restart: unless-stopped

  milvus-etcd:
    image: quay.io/coreos/etcd:v3.5.25
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    command:
      - etcd
      - --advertise-client-urls=http://milvus-etcd:2379
      - --listen-client-urls=http://0.0.0.0:2379
      - --data-dir=/etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3
    volumes:
      - milvus_etcd_data:/etcd
    restart: unless-stopped

  milvus-minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 20s
      retries: 3
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - milvus_minio_data:/minio_data
    restart: unless-stopped

  milvus:
    image: milvusdb/milvus:v2.6.20
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: milvus-etcd:2379
      MINIO_ADDRESS: milvus-minio:9000
      MQ_TYPE: woodpecker
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3
    ports:
      - "19530:19530"
      - "9091:9091"
    depends_on:
      milvus-etcd:
        condition: service_healthy
      milvus-minio:
        condition: service_healthy
    volumes:
      - milvus_data:/var/lib/milvus
    restart: unless-stopped

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.4.2
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms1g -Xmx1g
    ports:
      - "127.0.0.1:9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9200/_cluster/health >/dev/null || exit 1"]
      interval: 10s
      start_period: 60s
      timeout: 5s
      retries: 20
    mem_limit: 3g
    restart: unless-stopped

  mongodb:
    image: mongo:8.0
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  mongodb-init-replica:
    image: mongo:8.0
    depends_on:
      mongodb:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        mongosh --host mongodb:27017 --quiet --eval '
          try {
            rs.status();
          } catch (error) {
            rs.initiate({_id: "rs0", members: [{_id: 0, host: "mongodb:27017"}]});
          }
        '
        until mongosh --host mongodb:27017 --quiet --eval '
          quit(db.adminCommand({hello: 1}).isWritablePrimary ? 0 : 1)
        '; do sleep 2; done
    restart: "no"

  api:
    build:
      context: .
    environment:
      BILI_SUPPORT_ENVIRONMENT: local
      BILI_SUPPORT_DEBUG: "false"
      BILI_SUPPORT_HOST: 0.0.0.0
      BILI_SUPPORT_PORT: 8010
      BILI_SUPPORT_LOG_LEVEL: INFO
      BILI_SUPPORT_LLM_INTENT_MAX_TOKENS: ${BILI_SUPPORT_LLM_INTENT_MAX_TOKENS:-1024}
      BILI_SUPPORT_LLM_GROUNDED_MAX_TOKENS: ${BILI_SUPPORT_LLM_GROUNDED_MAX_TOKENS:-2048}
      BILI_SUPPORT_DATABASE_URL: mysql+aiomysql://root:local-mysql-root-password@mysql:3306/bili_support?charset=utf8mb4
      BILI_SUPPORT_DATABASE_AUTO_CREATE: "false"
      BILI_SUPPORT_REDIS_ENABLED: "true"
      BILI_SUPPORT_REDIS_REQUIRED: "true"
      BILI_SUPPORT_REDIS_URL: redis://redis:6379/0
      BILI_SUPPORT_MILVUS_ENABLED: "true"
      BILI_SUPPORT_MILVUS_REQUIRED: "true"
      BILI_SUPPORT_MILVUS_URI: http://milvus:19530
      BILI_SUPPORT_MILVUS_TOKEN: root:Milvus
      BILI_SUPPORT_MILVUS_COLLECTION: bili_support_child_v2
      BILI_SUPPORT_ELASTICSEARCH_ENABLED: "true"
      BILI_SUPPORT_ELASTICSEARCH_REQUIRED: "true"
      BILI_SUPPORT_ELASTICSEARCH_URL: http://elasticsearch:9200
      BILI_SUPPORT_ELASTICSEARCH_INDEX_PREFIX: bili-support-child
      BILI_SUPPORT_ELASTICSEARCH_READ_ALIAS: bili-support-child-read
      BILI_SUPPORT_GRAPH_CHECKPOINT_ENABLED: "true"
      BILI_SUPPORT_GRAPH_CHECKPOINT_REQUIRED: "true"
      BILI_SUPPORT_GRAPH_CHECKPOINT_MONGODB_URI: mongodb://mongodb:27017/?directConnection=true&replicaSet=rs0
      BILI_SUPPORT_GRAPH_CHECKPOINT_DATABASE: bili_support_graph
      BILI_SUPPORT_GRAPH_CHECKPOINT_TTL_SECONDS: "604800"
      BILI_SUPPORT_GRAPH_CHECKPOINT_ENCRYPTION_KEY: ${BILI_SUPPORT_GRAPH_CHECKPOINT_ENCRYPTION_KEY:-local-dev-checkpoint-key-32-byte}
      BILI_SUPPORT_GRAPH_REVIEW_ADMIN_USER_IDS: ${BILI_SUPPORT_GRAPH_REVIEW_ADMIN_USER_IDS:-review-admin}
      BILI_SUPPORT_API_TOKEN: local-demo-token
      BILI_SUPPORT_UI_PREFILL_DEMO_CREDENTIALS: "true"
      BILI_SUPPORT_UI_STORAGE_SECRET: local-compose-ui-secret
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      milvus:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      mongodb-init-replica:
        condition: service_completed_successfully
    ports:
      - "8010:8010"
    restart: unless-stopped

volumes:
  mysql_data:
  redis_data:
  milvus_etcd_data:
  milvus_minio_data:
  milvus_data:
  elasticsearch_data:
  mongodb_data:
